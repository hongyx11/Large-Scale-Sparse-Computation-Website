version: 1
project:
  title: Large-Scale Sparse Computation
  subtitle: From Kernels to Applications
  authors:
    - name: Yuxi Hong
  copyright: "2026"
  bibliography:
    - references.bib
  exports:
    - format: pdf
      articles:
        - intro.md
        - chapters/00_reading_guide.md
        - chapters/01_sparse_matrices.ipynb
        - chapters/02_spmv.ipynb
        - chapters/03_iterative_solvers.ipynb
        - chapters/99_references.md
      output: _build/exports/lssc.pdf
    - format: tex
      articles:
        - intro.md
        - chapters/00_reading_guide.md
        - chapters/01_sparse_matrices.ipynb
        - chapters/02_spmv.ipynb
        - chapters/03_iterative_solvers.ipynb
        - chapters/99_references.md
      output: _build/exports/lssc-tex
  toc:
    # Auto-generated by `myst init --write-toc`
    - file: README.md
    - file: about.md
    - file: intro.md
    - title: Chapters
      children:
        - file: chapters/00_reading_guide.md
        - file: chapters/01_sparse_matrices.ipynb
        - file: chapters/02_spmv.ipynb
        - file: chapters/03_iterative_solvers.ipynb
        - file: chapters/99_references.md
        - file: chapters/large_scale_sparse_computation.ipynb
        - file: chapters/syllabus.md
    
site:
  template: book-theme
  options:
    favicon: favicon.ico
    folders: true
    logo: assets/indexlab.png
    logo_alt: IndexLab
    logo_text: Large-Scale Sparse Computation
    style: styles/myst-overrides.css
  parts:
    primary_sidebar_footer:
      - Large-Scale Sparse Computation
